name: Supabase Daily Keep-Alive

# Backup for the Vercel cron in vercel.json. Hits the deployed endpoint, which
# runs a real query (no keys stored here). --fail turns a paused/broken
# database into a red run you get emailed about.
# Note: GitHub disables scheduled workflows after 60 days without repo commits.
on:
  schedule:
    - cron: '0 0 * * *' # 05:30 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --retry 3 --retry-delay 20 https://adminphotomanagement.vercel.app/api/cron/keep-alive
